# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sochupi_db?createDatabaseIfNotExist=true
spring.datasource.username=snjain28
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.profiles.active=local

# ─── Redis ───
# Redis runs on localhost:6379 by default (our Docker container)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ─── HikariCP Connection Pool ───
# max-pool-size: Maximum number of database connections kept alive at once.
# 10 is ideal for a single-server app. Going higher wastes RAM; going lower creates bottlenecks.
spring.datasource.hikari.maximum-pool-size=10
# minimum-idle: Keep at least 5 connections warm and ready, even during low traffic.
spring.datasource.hikari.minimum-idle=5
# connection-timeout: If all 10 connections are busy, wait up to 30 seconds before throwing an error.
spring.datasource.hikari.connection-timeout=30000
# idle-timeout: If a connection sits unused for 10 minutes, close it to free resources.
spring.datasource.hikari.idle-timeout=600000
# max-lifetime: Force-close and replace any connection older than 30 minutes (prevents stale DB connections).
spring.datasource.hikari.max-lifetime=1800000